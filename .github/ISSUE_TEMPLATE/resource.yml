name: Suggest a paper or resource
description: Propose a new entry for the research catalog.
title: "[Suggestion] "
body:
  - type: input
    id: title
    attributes:
      label: Official title
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Primary source URL
      description: Link the publisher, proceedings, DOI, preprint, or official project.
    validations:
      required: true
  - type: textarea
    id: relevance
    attributes:
      label: Why it belongs
      description: Describe the update target, feedback, and evaluation. For a dataset or benchmark, explain what it measures.
    validations:
      required: true
  - type: input
    id: artifacts
    attributes:
      label: Official code, data, or environment links
  - type: checkboxes
    id: duplicate
    attributes:
      label: Catalog check
      options:
        - label: I searched the existing catalog by title and identifier.
          required: true
