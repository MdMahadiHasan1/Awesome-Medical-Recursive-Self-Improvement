<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="350" viewBox="0 0 1280 350" role="img" aria-labelledby="title description">
  <title id="title">Medical RSI Research Atlas</title>
  <desc id="description">An abstract three-step loop for evidence, updates, and evaluation.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#0A1426"/>
      <stop offset="1" stop-color="#102C3E"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#A2D7EA" stroke-opacity=".1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="m1 1 6 3-6 3" fill="none" stroke="#69E5C9" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="1280" height="350" rx="20" fill="url(#background)"/>
  <rect x="1" y="1" width="1278" height="348" rx="19" fill="none" stroke="#2D5264" stroke-width="2"/>
  <path d="M792 32H1240V318H792Z" fill="url(#grid)"/>
  <path d="M746 52V298" stroke="#345669"/>

  <rect x="60" y="51" width="10" height="10" rx="2" fill="#69E5C9"/>
  <text x="84" y="62" fill="#93EEDB" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="700" letter-spacing="3">RESEARCH ATLAS</text>
  <g fill="#F2FAFF" font-family="DejaVu Sans, sans-serif" font-weight="700">
    <text x="57" y="145" font-size="69" letter-spacing="-2.5">Medical RSI</text>
    <text x="60" y="203" fill="#C5DCE7" font-size="29" font-weight="400">Recursive self-improvement in medical AI</text>
  </g>
  <path d="M60 251H686" stroke="#345669"/>
  <g font-family="DejaVu Sans Mono, monospace" font-size="15" letter-spacing="1.4" fill="#B5D0DE">
    <text x="60" y="290">PAPERS</text>
    <circle cx="154" cy="285" r="2.5" fill="#69E5C9"/>
    <text x="174" y="290">BENCHMARKS</text>
    <circle cx="310" cy="285" r="2.5" fill="#69E5C9"/>
    <text x="330" y="290">EVALUATION</text>
  </g>

  <g fill="none" stroke="#69E5C9" stroke-width="2.5" marker-end="url(#arrow)">
    <path d="M1053 91Q1111 106 1126 193"/>
    <path d="M1092 242H933"/>
    <path d="M895 194Q913 110 971 92"/>
  </g>
  <g fill="#102B3B" stroke="#5CC9B8" stroke-width="1.5">
    <circle cx="1012" cy="87" r="32"/>
    <circle cx="1132" cy="242" r="32"/>
    <circle cx="891" cy="242" r="32"/>
  </g>
  <g fill="none" stroke="#B1F5E7" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <rect x="1002" y="74" width="20" height="25" rx="2"/>
    <path d="M1007 81h10m-10 6h10m-10 6h6"/>
    <path d="M1120 242h24m-12-12v24"/>
    <path d="m882 242 6 6 12-12"/>
  </g>
  <g fill="#D3EAF0" font-family="DejaVu Sans Mono, monospace" font-size="14" letter-spacing="1.1" text-anchor="middle">
    <text x="1012" y="146">EVIDENCE</text>
    <text x="1132" y="300">UPDATE</text>
    <text x="891" y="300">EVALUATE</text>
  </g>
</svg>
